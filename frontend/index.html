<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TripPilot AI — Your intelligent travel companion. Book flights, hotels, and get AI-powered personalized itineraries." />
    <meta name="keywords" content="travel booking, flights, hotels, AI travel planner, itinerary, TripPilot" />
    <meta property="og:title" content="TripPilot AI — Intelligent Travel Planning" />
    <meta property="og:description" content="Plan your perfect trip with AI-powered recommendations, real-time bookings, and personalized itineraries." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>TripPilot AI — Intelligent Travel Planning</title>
  </head>
  <body>
    <!-- ── Flash-Of-Wrong-Theme Prevention ── -->
    <!-- Must run synchronously before any render so the correct theme class
         is already on <html> when CSS is first parsed. -->
    <script>
      (function () {
        try {
          // Always force light theme — remove dark class unconditionally
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
          localStorage.setItem('trippilot_theme', 'light');
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
